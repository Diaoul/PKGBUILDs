---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: updpkgsums

on:
  pull_request:
    types: ["opened", "synchronize"]
    branches: ["main"]

jobs:
  updpkgsums:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Find updated package
        run: |
          #!/usr/bin/env bash
          set -euxo pipefail

          echo "pkgbuild=$(git diff --name-only origin/main origin/${GITHUB_HEAD_REF} "*PKGBUILD" | head -1 | xargs dirname)" >> $GITHUB_ENV

      - name: Validate package
        if: ${{ env.pkgbuild != '' }}
        uses: ./.github/actions/aur
        with:
          action: "updpkgsums"
          pkgname: ${{ env.pkgbuild }}

      - name: Commit
        id: commit
        if: ${{ env.pkgbuild != '' }}
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          file_pattern: "*/PKGBUILD */.SRCINFO"

      # The run triggered by a GITHUB_TOKEN push waits for approval, leaving
      # the new head without checks, so Renovate never automerges
      - name: Report status on automatic commit
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_hash }}
        run: >-
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}"
          -f state=success
          -f context=updpkgsums
          -f description="Validated by the run that committed it"
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
